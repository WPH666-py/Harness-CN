<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:">
    <title>评价与反馈</title>
    <link rel="stylesheet" href="./feedback.css">
  </head>
  <body>
    <main>
      <h1>评价与反馈</h1>
      <p id="intro"></p>
      <form id="form">
        <label id="message-label" for="message"></label>
        <textarea id="message" name="message" rows="8" required></textarea>
        <label id="email-label" for="email"></label>
        <input id="email" name="email" type="email" autocomplete="email" spellcheck="false" placeholder="123456789@qq.com" required>
        <p id="hint"></p>
        <div class="actions">
          <button id="send" type="submit"></button>
        </div>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./feedback.js"></script>
  </body>
</html>
