<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; media-src 'self'">
    <title id="page-title"></title>
    <link rel="stylesheet" href="./startup.css">
  </head>
  <body>
    <main>
      <video id="clip" src="./Harness-loading.mp4" autoplay loop muted playsinline></video>
      <h1 id="title"></h1>
      <p id="subtitle"></p>
      <div id="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="bar"></div>
      </div>
      <!-- The step the launch is in, with that step's own percentage. The overall bar moves so
           little within one step of a first launch that it cannot say whether that step is
           working or stuck; this is the figure that can. -->
      <p id="step" role="status" aria-live="polite"></p>
      <!-- What the launch is doing right now, in more detail than the step name carries. The
           first launch downloads the offline package before it can install anything, which takes
           long enough that a bare progress bar reads as a hang. -->
      <p id="note" role="status" aria-live="polite"></p>
      <p id="elapsed" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./startup.js"></script>
  </body>
</html>
