[package]
name = "harness-cn"
version = "0.1.5-rc.3"
description = "Harness-CN desktop shell"
authors = ["水哥"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `windows-sys` is already in the tree through Tauri's own Windows support; declaring it
# directly is what lets the shell own its single-instance claim and its fatal-error dialog
# without pulling a plugin, a runtime, or a JavaScript API into a process that has no use
# for any of them.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
