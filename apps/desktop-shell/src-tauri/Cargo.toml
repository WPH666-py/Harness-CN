[package]
name = "harness-cn"
version = "0.1.5-rc.11"
description = "Harness-CN desktop shell"
authors = ["水哥"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` keeps the menu's developer-tools entry working in a release build, which is what
# the Electron shell it replaces did; without the feature the call does not exist at all.
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `windows-sys` is already in the tree through Tauri's own Windows support; declaring it
# directly is what lets the shell own its single-instance claim and its fatal-error dialog
# without pulling a plugin, a runtime, or a JavaScript API into a process that has no use
# for any of them.
[target.'cfg(windows)'.dependencies]
# `Win32_Security` is not optional here even though nothing in this crate names a security type:
# `CreateMutexW` takes a `SECURITY_ATTRIBUTES` pointer, and windows-sys gates the whole function
# behind that feature rather than behind the threading module it is declared in.
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
