# Electron reuses the browser composition without its browser-launch rows.
#
# The webserver row stays mounted, bound to an OS-assigned loopback port. A plugin host half
# registers its own routes through `ctx.inject(['webServer'])`, so with this row disabled
# those routes never exist: the request falls through to the shell's asset handler, which
# answers index.html, and a panel that expected JSON reports a parse failure. Only the
# desktop carrier requests this port, and no row here opens a URL.

- id: web-startup
  disabled: true

- id: webserver
  inject: []
  config:
    host: 127.0.0.1
    port: 0

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true

# A bundled third-party plugin also replaces the stock `directory-picker` row, inserting its own
# browse pair behind a platform guard: `process.platform === 'win32' && (desktopRuntime is win32 ||
# desktopProfiles is defined)`. That guard exists so a DSH Desktop profile keeps the in-page
# picker, but this host provides neither service, so on Windows the guard is always false and the
# browse pair would mount alongside the native pair inserted below. Both backends register the
# same single-instance `directoryPicker` service, and the second registration fails the whole
# plugin tree. These two rows therefore belong to the desktop carrier: disable them here, in the
# winning layer, whatever plugin inserted them.
- id: directory-picker-mobile-host
  disabled: true

- id: directory-picker-mobile-surface
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

- insert:
    - id: directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'

    # DeepSeek account sign-in and the balance/bonus surface it feeds. The three host rows come
    # from the official product's own composition — `dsh-base` mounts `authorization` and
    # `deepseek-account`, `dsh-web-app` mounts `account-controller` — but this line carries none
    # of them, so the packages would sit unused in the profile.
    #
    # They belong to this file rather than a bundle patch: the packages are installed only by the
    # Desktop seed, and a bundle layer is shared with every other profile this line can serve,
    # where an insert naming an absent package fails the whole plugin tree at boot.
    #
    # The platform package branches on the carrier it runs under. Its own default is `null`
    # (send no client-platform header); the official desktop composition passes the host OS, so
    # the service stamps `x-client-platform: desktop-win` / `desktop-mac` on Platform requests.
    - id: authorization
      name: '@deepseek-ai/dsh-authorization'

    - id: deepseek-account
      name: '@deepseek-ai/dsh-deepseek-account-platform'
      config:
        desktopPlatform: !!js "['darwin', 'win32'].includes(process.platform) ? process.platform : null"

    - id: account-controller
      name: '@deepseek-ai/dsh-api-account-controller'

    # The browser half is this line's own package, not the official one: the official client
    # registers into `settings.launcher`, `settings.models.sign-in` and `shell.quota-notice`,
    # none of which exist here, so it would mount without ever rendering an entry.
    - id: ui-settings-account-harness
      name: '@deepseek-ai/dsh-client-ui-settings-account-harness'
